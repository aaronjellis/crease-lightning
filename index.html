<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crease Lightning: pop-up card maker</title>
<style>
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: #f4f1ec; color: #222; }
  #scene { display: block; width: 100%; height: 72vh; touch-action: none; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 12px 16px; }
  #status, #step-text { margin: 0 16px 8px; }
  #still[hidden] { display: none; }
  #still { display: block; max-width: 320px; margin: 0 16px 16px; border: 1px solid #ccc; }
</style>
</head>
<body>
<!-- Dev harness for the 3D view (Task 12). Task 13 replaces this page with the real UI. -->
<canvas id="scene" aria-label="3D preview of the card"></canvas>
<div class="bar">
  <label>Open angle <input id="angle" type="range" min="0" max="180" step="1" value="0"> <output id="angle-out">0°</output></label>
  <button id="open" type="button">Open</button>
  <button id="close" type="button">Close</button>
  <span>Fold it:</span>
  <button type="button" data-step="0">Step 1</button>
  <button type="button" data-step="1">Step 2</button>
  <button type="button" data-step="2">Step 3</button>
  <button type="button" data-step="3">Step 4</button>
  <button type="button" data-step="off">Done</button>
  <button id="png" type="button">Render still</button>
</div>
<p id="step-text"></p>
<p id="status">Loading…</p>
<img id="still" alt="Rendered still of the card" hidden>
<script type="module" src="/src/dev/harness.ts"></script>
</body>
</html>
